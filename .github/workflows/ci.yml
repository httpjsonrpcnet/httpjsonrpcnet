name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/HttpJsonRpc.sln -c Release -p:GeneratePackageOnBuild=false
      - run: dotnet test src/HttpJsonRpc.Tests/HttpJsonRpc.Tests.csproj -c Release --no-build --logger trx
      - run: dotnet list src/HttpJsonRpc/HttpJsonRpc.csproj package --vulnerable --include-transitive --source 'https://api.nuget.org/v3/index.json'
      - run: dotnet pack src/HttpJsonRpc/HttpJsonRpc.csproj -c Release --no-build -o artifacts -p:GeneratePackageOnBuild=false
      - shell: pwsh
        run: ./eng/Verify-Package.ps1 (Get-ChildItem artifacts/*.nupkg).FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            src/HttpJsonRpc.Tests/TestResults/*.trx
            artifacts/*.nupkg
